function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return el;
}

function hash(s) {
  let x = 2166136261;
  for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }

}
function rng(seed) {
  let a = seed;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* 8x8 mirrored pixel icon, generated from a text seed */
function pixelIcon(seed, colors, size = 72) {
  const cv = h("canvas", { class: "px", "aria-hidden": "true", width: "8", height: "8" });
  cv.style.width = cv.style.height = size + "px";
  const g = cv.getContext("2d");
  const r = rng(hash(seed));
  g.fillStyle = "#0A0D12"; g.fillRect(0, 0, 8, 8);
  const main = colors[(r() * colors.length) | 0];
  const alt = colors[(r() * colors.length) | 0];
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 4; x++) {
      const v = r();
      if (v > 0.5) {
        g.fillStyle = v > 0.86 ? alt : main;
        g.fillRect(x, y, 1, 1);
        g.fillRect(7 - x, y, 1, 1);
      }
    }
  }
  return cv;
}

/* Ground strata with ore veins, drawn once per width */
function drawStrata() {
  const cv = $("#strata");
  if (!cv) return;
  const bs = 16, rows = 9;
  const cols = Math.ceil(document.documentElement.clientWidth / bs);
  cv.width = cols * bs; cv.height = rows * bs;
  cv.style.width = cv.width + "px"; cv.style.height = cv.height + "px";
  const g = cv.getContext("2d");
  g.clearRect(0, 0, cv.width, cv.height);
  const r = rng(hash("kitsakorn-strata"));
  const stone = ["#262D3B", "#2A3242", "#222836"];
  let top = 2;
  for (let c = 0; c < cols; c++) {
    const m = r();
    if (m < 0.2) top--; else if (m > 0.8) top++;
    top = Math.max(1, Math.min(4, top));
    for (let row = top; row < rows; row++) {
      const x = c * bs, y = row * bs;
      g.fillStyle = row === top ? "#3E4C66" : row === top + 1 ? (r() < 0.5 ? "#33405A" : "#2F3B54") : stone[(r() * 3) | 0];
      g.fillRect(x, y, bs, bs);
      g.fillStyle = r() < 0.5 ? "rgba(255,255,255,.04)" : "rgba(0,0,0,.16)";
      g.fillRect(x + ((r() * 3) | 0) * 4, y + ((r() * 3) | 0) * 4, 4, 4);
      g.fillStyle = "rgba(0,0,0,.28)";
      g.fillRect(x, y + bs - 1, bs, 1); g.fillRect(x + bs - 1, y, 1, bs);
      if (row > top + 1) {
        const o = r();
        const ore = o < 0.035 ? C.cyan : o < 0.06 ? C.red : o < 0.075 ? C.gold : null;
        if (ore) {
          g.fillStyle = ore;
          [[3, 3], [9, 2], [6, 8], [11, 10]].forEach(([dx, dy]) => g.fillRect(x + dx, y + dy, 4, 4));
        }
      }
    }
  }
}

/* ============================================================
   Sections
   ============================================================ */
function section(id, title, ...content) {
  return h("section", { class: "sec", id }, h("h2", {}, title), ...content);
}

function emptyOr(text, cls = "") {
  return text
    ? h("p", { class: cls }, text)
    : h("p", { class: ("empty " + cls).trim() }, T.soon);
}

function buildTerminal(bar) {
  const steps = [
    { cmd: "whoami", out: [P.name] },
    { cmd: "cat focus.txt", out: [P.headline] },
    { cmd: "ls certs/", out: [P.certs.slice(0, 3).map(c => c.slug).join("  ")] },
    { cmd: "cat private.txt", out: [T.privA, " ", bar, T.privB], note: T.hintTerm }
  ];
  const rows = [];
  let d = 0.5;
  for (const s of steps) {
    const dur = +(s.cmd.length * 0.045).toFixed(2);
    rows.push(h("div", { class: "tl", style: `--d:${d}s;--dur:${dur}s;--n:${s.cmd.length}` },
      h("span", { class: "ps1" }, "$ "), h("span", { class: "cmd" }, s.cmd)));
    d = +(d + dur + 0.2).toFixed(2);
    rows.push(h("div", { class: "tl out", style: `--d:${d}s` }, s.out));
    if (s.note) rows.push(h("div", { class: "tl out cmt", style: `--d:${d}s` }, s.note));
    d = +(d + 0.35).toFixed(2);
  }
  rows.push(h("div", { class: "tl", style: `--d:${d}s` }, h("span", { class: "ps1" }, "$ "), h("span", { class: "cursor" })));
  return h("div", { class: "term", role: "group", "aria-label": "Terminal" },
    h("div", { class: "term-bar" }, h("i"), h("i"), h("i"), h("span", {}, "kitsakorn@portfolio: ~")),
    h("div", { class: "term-body" }, rows)
  );
}

function buildHero() {
  const bar = h("button", { class: "redact", type: "button", "aria-pressed": "false" }, T.redacted);
  bar.addEventListener("click", () => {
    bar.setAttribute("aria-pressed", bar.getAttribute("aria-pressed") === "true" ? "false" : "true");
  });
  const [first, ...rest] = P.name.split(" ");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const avatar = P.avatarGif
    ? h("img", { class: "px", src: reduceMotion ? P.avatarGifStatic : P.avatarGif, alt: "", width: "96", height: "96" })
    : P.avatar
    ? h("img", { class: "px", src: P.avatar, alt: "", width: "96", height: "96" })
    : pixelIcon(P.name, [C.cyan, C.gold, C.red], 96);
  return h("section", { class: "hero" },
    h("div", {},
      avatar,
      h("h1", {}, h("span", {}, first), " ", h("span", {}, rest.join(" "))),
      h("div", { class: "btns" },
        h("a", { class: "btn", href: P.github, rel: "noopener" }, "GitHub"),
        h("a", { class: "btn ghost", href: P.linkedin, rel: "noopener" }, "LinkedIn")
      )
    ),
    buildTerminal(bar)
  );
}

function buildSkills() {
  return section("skills", T.skills,
    P.skillGroups.map(g => [
      h("h3", { class: "group" }, g.title),
      h("div", { class: "skillgrid" }, g.items.map(s =>
        h("details", { class: "skill" },
          h("summary", {},
            h("div", { class: "slot", "aria-hidden": "true" }, s.abbr),
            h("span", { class: "name" }, s.name),
            h("span", { class: "chev", "aria-hidden": "true" })
          ),
          h("p", { class: "more" }, s.more)
        )
      ))
    ]),
    P.tools && P.tools.length ? [
      h("h3", { class: "sub" }, T.tools),
      h("ul", { class: "tags" }, P.tools.map(x => h("li", {}, x)))
    ] : null
  );
}

function buildExperience() {
  return section("experience", T.experience,
    h("ul", { class: "list" }, P.experience.map(e =>
      h("li", { class: "exp panel" },
        h("div", {},
          h("h3", {}, e.title),
          h("p", { class: "org" }, e.org),
          e.award ? h("span", { class: "award" }, e.award) : null
        ),
        h("p", { class: "when" }, e.when),
        h("ul", { class: "points" }, e.points.map(x => h("li", {}, x)))
      )
    ))
  );
}

function projectDialog(p) {
  const dlg = h("dialog", { class: "modal", "aria-label": p.name + " details" });
  const close = h("button", { class: "btn ghost", type: "button" }, T.close);
  close.addEventListener("click", () => dlg.close());
  dlg.append(
    h("div", { class: "modal-head" }, h("h3", {}, p.name), close),
    h("div", { class: "modal-body" },
      p.image ? h("img", { class: "shot", src: p.image, alt: p.name + " screenshot", loading: "lazy" }) : null,
      emptyOr(p.desc, "desc"),
      p.tags && p.tags.length ? h("ul", { class: "tags" }, p.tags.map(x => h("li", {}, x))) : null,
      h("a", { class: "btn go", href: p.url, rel: "noopener" }, T.viewRepo)
    )
  );
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("close", () => { document.documentElement.style.overflow = ""; });
  return dlg;
}

function buildProjects() {
  return section("projects", T.projects,
    h("p", { class: "note" }, T.projectsNote),
    h("ul", { class: "list" }, P.projects.map(p => {
      const dlg = projectDialog(p);
      const open = h("button", { class: "btn more-btn", type: "button", "aria-haspopup": "dialog", "aria-label": T.details + ": " + p.name }, T.details);
      open.addEventListener("click", () => {
        document.documentElement.style.overflow = "hidden";
        dlg.showModal();
      });
      return h("li", { class: "proj panel" },
        p.image
          ? h("img", { class: "thumb", src: p.image, alt: "", loading: "lazy" })
          : pixelIcon(p.name, [C.cyan, C.red, C.gold], 90),
        h("h3", {}, p.name),
        open,
        dlg
      );
    }))
  );
}

function buildCerts() {
  return section("certs", T.certs,
    h("ul", { class: "list" }, P.certs.map(c =>
      h("li", { class: "cert panel" },
        c.badge
          ? h("img", { class: "badge", src: c.badge, alt: c.issuer + " credential badge", width: "96", height: "96", style: "background:" + (c.badgeBg || "#fff") })
          : pixelIcon(c.name, [C.gold, C.cyan], 96),
        h("div", {}, h("h3", {}, c.name), h("p", { class: "issuer" }, c.issuer)),
        h("div", { class: "meta-col" },
          h("p", { class: "meta" },
            h("b", {}, T.issued), " ", c.issued,
            c.expires ? [h("br"), h("b", {}, T.expires), " ", c.expires] : null
          ),
          c.id || c.verify ? h("p", { class: "meta" },
            c.id ? [h("b", {}, T.credId), h("br"), h("code", {}, c.id)] : null,
            c.verify ? [c.id ? h("br") : null, h("a", { href: c.verify, rel: "noopener" }, T.verify)] : null
          ) : null
        )
      )
    ))
  );
}

function buildEducation() {
  const e = P.education;
  return section("education", T.education,
    h("div", { class: "exp panel" },
      h("div", {}, h("h3", {}, e.degree), h("p", { class: "org" }, e.school)),
      h("p", { class: "when" }, e.when)
    )
  );
}

function buildContact() {
  const rows = [
    ["GitHub", h("a", { href: P.github, rel: "noopener" }, P.github.replace("https://", ""))],
    ["LinkedIn", h("a", { href: P.linkedin, rel: "noopener" }, P.linkedin.replace("https://www.", "").replace(/\/$/, ""))]
  ];
  if (P.email) rows.push([T.email, h("a", { href: "mailto:" + P.email }, P.email)]);
  if (P.location) rows.push([T.location, P.location]);
  return section("contact", T.contact,
    h("dl", { class: "contact panel" }, rows.map(([k, v]) => [h("dt", {}, k), h("dd", {}, v)]))
  );
}

function render() {
  document.querySelectorAll("[data-k]").forEach(el => { el.textContent = T[el.dataset.k]; });
  $("#copy").textContent = "© " + new Date().getFullYear() + " " + P.name;

  $("#main").replaceChildren(
    buildHero(),
    section("about", T.about, emptyOr(P.about, "about")),
    buildSkills(),
    buildExperience(),
    buildProjects(),
    buildCerts(),
    buildEducation(),
    buildContact()
  );
}

let strataQueued = false;
window.addEventListener("resize", () => {
  if (strataQueued) return;
  strataQueued = true;
  requestAnimationFrame(() => { strataQueued = false; drawStrata(); });
});

render();
drawStrata();
</script>
</body>
</html>
